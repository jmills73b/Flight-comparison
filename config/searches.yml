# Florida 2027 Fare Watch — what gets searched.
#
# EDITING THE TRIP
# Change a date below and everything follows: the 12 itineraries, the 7 shared
# one-way legs and the 6 TUI searches are all generated from this file, so
# there is only ever one place to edit. Run `npm run urls` afterwards to see
# the new search list before committing.
#
# CHANGING A RETURN DATE
# Safe to do at any time. The affected itineraries start a FRESH price history
# rather than continuing the old one, because a different return date is a
# different trip and the prices are not comparable. The old series is kept —
# nothing is lost, it just stops there and is marked retired on the dashboard.
#
# Airport codes are IATA. LON is a metro code covering Gatwick + Heathrow, so
# one search returns both and the actual airport is recorded per result.

trip:
  name: Florida 2027
  currency: GBP
  locale: en-GB
  country: GB

  # THE PARTY, BY REAL AGE AT DATE OF TRAVEL (August 2027).
  #
  # Ages are stored rather than fare categories, because airlines disagree
  # about the categories. A real British Airways search URL uses
  # adults=2&youngAdults=1&children=1 — BA buckets 12 to 15 year olds as
  # "young adults", where Google has no such category and treats 12 as an
  # adult. Storing the conclusion would bake one airline's rules into every
  # provider; storing the ages lets each adapter bucket them its own way.
  adults: 2                 # the two parents
  children_ages: [12, 9]    # ages on the outbound date
  infants: 0

  cabin: economy          # economy | premium_economy | business | first
  checked_bags: 4         # one per passenger
  # Direct flights only. Asked for explicitly: with a 9- and 12-year-old, a
  # 13h30 one-stop is not a cheaper version of the same trip, it is a
  # different trip. Enforced twice — the search asks for direct where the
  # provider supports it, and any offer not confirmed as direct is dropped.
  max_stops: 0

# ---------------------------------------------------------------------------
# OUTBOUND — fixed. Fly from London on either date, into either airport.
# ---------------------------------------------------------------------------
outbound:
  origin: LON
  dates:
    - 2027-08-11        # Wednesday
    - 2027-08-12        # Thursday
  into:
    - MCO               # Orlando International
    - TPA               # Tampa International

# ---------------------------------------------------------------------------
# RETURNS — the part most likely to change. Edit a date here and the whole
# matrix follows.
#
#   shape A   come home from Florida
#   shape B   drive south and come home from Miami (an open jaw)
#
# `from` lists every airport you would consider flying home from on that date.
# Where it differs from the arrival airport, that is an in-state open jaw.
#
# To add a third option, add another entry with its own shape letter. To drop
# one, delete it — its price history stays in data/history.csv either way.
# ---------------------------------------------------------------------------
returns:
  - shape: A
    date: 2027-08-26    # Thursday — locked in
    from: [MCO, TPA]

  - shape: B
    # The date actually wanted, flying home from Miami. Not yet bookable:
    # airlines only sell about 353 days ahead, so on 7 Sep 2026 the furthest
    # date on sale was 26 Aug 2027, and it advances by one day each day.
    date: 2027-08-29    # Sunday — the target
    from: [MIA]
    # Until the target comes into range, search the furthest date that IS
    # bookable, which rolls forward automatically. No daily edit needed: on
    # 8 Sep it searches the 27th, on the 9th the 28th, and from the 10th it
    # locks onto the 29th and stays there.
    #
    # Those interim searches are each a DIFFERENT trip — a different return
    # date is a different length of holiday — so they are marked provisional
    # and get their own short-lived price series rather than being spliced
    # into one misleading line.
    roll_until_available: true

# ---------------------------------------------------------------------------
# TUI charter. Gatwick only — TUI does not operate from Heathrow.
#
# Charter flies weekly rotations, so TUI mostly sells 7 and 14 night trips.
# `preferred_nights` marks which generated searches fit that pattern and are
# therefore most likely to exist; the others are still attempted, and an empty
# result for them is expected rather than a bug.
#
# Tied to the shape A return, because charter sells matched return rotations
# and TUI does not serve Miami from the UK — so shape B has no TUI option.
#
# SFB is Orlando Sanford, ~45 min from the parks. It is effectively a
# charter-only route from the UK, which is why it appears here and not in the
# scheduled matrix above.
# ---------------------------------------------------------------------------
tui:
  airport: LGW
  destinations: [MCO, SFB, TPA]
  return_shape: A
  # Charter sells whole-week rotations, so both 7 and 14 nights fit. With the
  # return locked to 26 August, flying out on the 12th is exactly 14 nights —
  # a proper fortnight rotation, which puts TUI genuinely in play rather than
  # being a long shot.
  preferred_nights: [7, 14]

# Human-readable airport names, used in search text and on the dashboard.
airports:
  LON: { name: London, city: London }
  LGW: { name: London Gatwick, city: London }
  LHR: { name: London Heathrow, city: London }
  MCO: { name: Orlando International, city: Orlando }
  SFB: { name: Orlando Sanford, city: Orlando }
  TPA: { name: Tampa International, city: Tampa }
  MIA: { name: Miami International, city: Miami }
