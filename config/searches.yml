# Florida 2027 Fare Watch — what gets searched.
#
# Edit this file to change the trip. Everything else reads from here.
# Airport codes are IATA. LON is a metro code covering Gatwick + Heathrow,
# so one search returns both and the actual airport is recorded per result.

trip:
  name: Florida 2027
  currency: GBP
  locale: en-GB
  country: GB

  # Ages are AT DATE OF TRAVEL (August 2027), not today.
  # Airline child fare bands run 2-11 inclusive, so a 12-year-old is an adult.
  # If a carrier turns out to treat 12 as a child, change to adults: 2, children: [9, 12].
  adults: 3
  children: [9]
  infants: 0

  cabin: economy          # economy | premium_economy | business | first
  checked_bags: 4         # one per passenger
  max_stops: 1            # direct and one-stop; 2+ excluded

# ---------------------------------------------------------------------------
# The 12 itineraries. Priced as a single ticket (return or multi-city).
# Shape A comes home from Florida on 19 Aug; Shape B from Miami on 22 Aug.
# Where `into` and `home_from` differ, it is an open jaw: drive between them.
# ---------------------------------------------------------------------------
itineraries:
  - { id: A1, shape: A, out: 2027-08-11, back: 2027-08-19, origin: LON, into: MCO, home_from: MCO, nights: 8 }
  - { id: A2, shape: A, out: 2027-08-11, back: 2027-08-19, origin: LON, into: MCO, home_from: TPA, nights: 8 }
  - { id: A3, shape: A, out: 2027-08-11, back: 2027-08-19, origin: LON, into: TPA, home_from: TPA, nights: 8 }
  - { id: A4, shape: A, out: 2027-08-11, back: 2027-08-19, origin: LON, into: TPA, home_from: MCO, nights: 8 }
  - { id: A5, shape: A, out: 2027-08-12, back: 2027-08-19, origin: LON, into: MCO, home_from: MCO, nights: 7 }
  - { id: A6, shape: A, out: 2027-08-12, back: 2027-08-19, origin: LON, into: MCO, home_from: TPA, nights: 7 }
  - { id: A7, shape: A, out: 2027-08-12, back: 2027-08-19, origin: LON, into: TPA, home_from: TPA, nights: 7 }
  - { id: A8, shape: A, out: 2027-08-12, back: 2027-08-19, origin: LON, into: TPA, home_from: MCO, nights: 7 }
  - { id: B1, shape: B, out: 2027-08-11, back: 2027-08-22, origin: LON, into: MCO, home_from: MIA, nights: 11 }
  - { id: B2, shape: B, out: 2027-08-11, back: 2027-08-22, origin: LON, into: TPA, home_from: MIA, nights: 11 }
  - { id: B3, shape: B, out: 2027-08-12, back: 2027-08-22, origin: LON, into: MCO, home_from: MIA, nights: 10 }
  - { id: B4, shape: B, out: 2027-08-12, back: 2027-08-22, origin: LON, into: TPA, home_from: MIA, nights: 10 }

# ---------------------------------------------------------------------------
# Seven one-way legs. Adding a matching pair gives the "two separate tickets"
# price for any itinerary above, so this costs 7 searches rather than 24.
# ---------------------------------------------------------------------------
legs:
  - { id: O1, date: 2027-08-11, from: LON, to: MCO, composes: [A1, A2, B1] }
  - { id: O2, date: 2027-08-11, from: LON, to: TPA, composes: [A3, A4, B2] }
  - { id: O3, date: 2027-08-12, from: LON, to: MCO, composes: [A5, A6, B3] }
  - { id: O4, date: 2027-08-12, from: LON, to: TPA, composes: [A7, A8, B4] }
  - { id: R1, date: 2027-08-19, from: MCO, to: LON, composes: [A1, A4, A5, A8] }
  - { id: R2, date: 2027-08-19, from: TPA, to: LON, composes: [A2, A3, A6, A7] }
  - { id: R3, date: 2027-08-22, from: MIA, to: LON, composes: [B1, B2, B3, B4] }

# ---------------------------------------------------------------------------
# TUI charter. Gatwick only — TUI does not operate from Heathrow.
# Charter flies weekly rotations, so 7 nights (12->19 Aug, Thu->Thu) is the
# only pair that fits cleanly. rotation_fit: false means an empty result is
# expected rather than a bug.
# SFB is Orlando Sanford, ~45 min from the parks, effectively charter-only
# from the UK — which is why it appears here and not in the itineraries above.
# ---------------------------------------------------------------------------
tui:
  - { id: T1, airport: LGW, dest: MCO, out: 2027-08-11, back: 2027-08-19, nights: 8, rotation_fit: false }
  - { id: T2, airport: LGW, dest: SFB, out: 2027-08-11, back: 2027-08-19, nights: 8, rotation_fit: false }
  - { id: T3, airport: LGW, dest: TPA, out: 2027-08-11, back: 2027-08-19, nights: 8, rotation_fit: false }
  - { id: T4, airport: LGW, dest: MCO, out: 2027-08-12, back: 2027-08-19, nights: 7, rotation_fit: true }
  - { id: T5, airport: LGW, dest: SFB, out: 2027-08-12, back: 2027-08-19, nights: 7, rotation_fit: true }
  - { id: T6, airport: LGW, dest: TPA, out: 2027-08-12, back: 2027-08-19, nights: 7, rotation_fit: true }

# Human-readable airport names, used in search text and on the dashboard.
airports:
  LON: { name: London, city: London }
  LGW: { name: London Gatwick, city: London }
  LHR: { name: London Heathrow, city: London }
  MCO: { name: Orlando International, city: Orlando }
  SFB: { name: Orlando Sanford, city: Orlando }
  TPA: { name: Tampa International, city: Tampa }
  MIA: { name: Miami International, city: Miami }
