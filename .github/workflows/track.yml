name: Track fares

on:
  schedule:
    # 07:17 and 19:17 UTC. Deliberately off the hour: GitHub delays runs
    # scheduled at :00 heavily, because everyone schedules them there.
    - cron: '17 7,19 * * *'
  workflow_dispatch:
    inputs:
      only:
        description: 'Run a single search id (e.g. O1), or with a probe, comma-separated probe case ids. Blank for all.'
        required: false
        type: string
      probe:
        description: 'Diagnostic: search a date 60 days out to prove whether the scraper works at all. Writes no data.'
        required: false
        default: false
        type: boolean
      probe_airlines:
        description: 'Diagnostic: run BA and Virgin against dates known to be bookable, and save the pages. Writes no price history.'
        required: false
        default: false
        type: boolean
      probe_forms:
        description: 'Diagnostic: dump the BA and Virgin search FORM structure, so form-driving selectors are written from evidence. Writes no price history.'
        required: false
        default: false
        type: boolean
      probe_profiles:
        description: 'Browser profiles the airline probe uses. Blank runs one; "all" sweeps all three.'
        required: false
        default: ''
        type: string
      browser_profile:
        description: 'Browser profile for a normal collection run.'
        required: false
        default: 'stealth-headed'
        type: choice
        options: ['stealth-headed', 'stealth', 'plain']

# Never let two runs write to the repository at once.
concurrency:
  group: track-fares
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    # A three-profile probe sweep is twelve page loads with waits between them,
    # which does not fit the 30 minutes a plain collection needs.
    timeout-minutes: 45

    env:
      # Both airlines refuse to serve prices to a stock headless Chromium, so
      # the default is a real window on a virtual display with the stealth
      # evasions applied. See scripts/lib/browser.js.
      BROWSER_PROFILE: ${{ inputs.browser_profile || 'stealth-headed' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Chrome as well as Chromium: the stealth-headed profile prefers real
      # Google Chrome, whose codecs and branding several bot detectors check
      # for. It falls back to Chromium if this step ever stops providing it.
      - name: Install browsers
        run: npx playwright install --with-deps chromium chrome

      # xvfb-run gives the headed profiles a display. It is harmless for the
      # headless ones, which ignore DISPLAY entirely.
      - name: Collect fares
        id: collect
        continue-on-error: true
        run: |
          if [ "${{ inputs.probe_forms }}" = "true" ]; then
            xvfb-run -a node scripts/probe-forms.js
          elif [ "${{ inputs.probe_airlines }}" = "true" ]; then
            args=""
            [ -n "${{ inputs.probe_profiles }}" ] && args="$args --profiles ${{ inputs.probe_profiles }}"
            [ -n "${{ inputs.only }}" ] && args="$args --only ${{ inputs.only }}"
            xvfb-run -a node scripts/probe-airlines.js $args
          elif [ "${{ inputs.probe }}" = "true" ]; then
            xvfb-run -a node scripts/collect.js --probe
          elif [ -n "${{ inputs.only }}" ]; then
            xvfb-run -a node scripts/collect.js --only "${{ inputs.only }}"
          else
            xvfb-run -a node scripts/collect.js
          fi

      - name: Rebuild dashboard data
        if: always()
        run: node scripts/build-site.js

      # Committed even when collection failed: a recorded failure is data, and
      # the daily commit is also what stops GitHub disabling this schedule
      # after 60 days of inactivity.
      - name: Commit results
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs/data.json
          if git diff --staged --quiet; then
            echo "No change to commit."
            exit 0
          fi
          git commit -m "Fare snapshot $(date -u '+%Y-%m-%d %H:%M UTC')"

          # Anything else may have landed on main while this run was collecting
          # — a hand push, or an overlapping run. Rebase onto it and retry
          # rather than losing the results, which is what a bare push does.
          for attempt in 1 2 3; do
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected, rebasing onto origin/main (attempt $attempt)."
            git pull --rebase --autostash origin main || exit 1
          done
          echo "Could not push after 3 attempts."
          exit 1

      # Must be always(): without it, a failed commit step skips this one and a
      # failed collection is reported as a green run.
      - name: Fail if collection failed
        if: always() && steps.collect.outcome == 'failure'
        run: |
          echo "Collection failed — see the 'Collect fares' step above."
          echo "Raw HTML for failed searches is committed under data/debug/."
          exit 1
